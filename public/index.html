<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sistema de Inventario & Catálogo Deportivo</title>
  <meta name="description" content="Gestión de stock, punto de venta y catálogo público de prendas deportivas." />

  <!-- PWA: manifest + meta tags -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inventario" />

  <!-- iOS: icono de inicio (necesario para standalone en iOS) -->
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

  <!-- Estilos base para evitar FOUC -->
  <style>
      html, body, #root {
         height: 100%;
         width: 100%;
         min-height: 100vh;
         margin: 0;
         padding: 0;
         background-color: #0A0A0A;
         overflow: hidden;
      }
      #root {
         display: flex;
         flex-direction: column;
      }
   </style>
  </head>
<body>
  <div id="root"></div>
</body>
</html>
